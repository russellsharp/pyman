[project]
name = "pyman"
version = "0.1.0"
description = ""
authors = [{ name = "russellicious", email = "russellsharp80@gmail.com" }]
requires-python = ">=3.14,<3.15"
dependencies = [
    "pytest (>=9.1.1,<10.0.0)",
    "flask (>=3.1.3,<4.0.0)",
    "typer (>=0.27.2,<0.28.0)",
    "elevate (>=0.1.3,<0.2.0)",
    "pyinstaller (>=6.22.3,<7.0.0)",
    "pydantic (>=2.14.1,<3.0.0)",
]


[tool.poetry]
packages = [{include = "*", from = "src"}, {include = "*", from = "src/utilities"}, {include = "*", from = "test"}]

[top]
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.pytest.ini_options]
addopts = "-vvs -ra -q --import-mode=importlib --capture=tee-sys"
minversion = "7.0"
pythonpath = ["src", "."]
testpaths = ["test"]